<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Dinosaure Toulousain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="startScreen">
        <h1>Ride ton Toulousain</h1>
        
        <div class="input-group">
            <label for="playerName">Nom du joueur :</label>
            <input type="text" id="playerName" value="Joueur 1">
        </div>

        <div class="score-info">
            <p>Score max à dépasser : <span id="highScoreDisplay">0</span></p>
        </div>

        <div class="leaderboard">
            <h3>🏆 Top 5 des Joueurs</h3>
            <ul id="leaderboardList">
                </ul>
        </div>

        <button id="startBtn">Lancer la partie</button>
    </div>

    <div id="gameArea" class="hidden">
        
        <div id="gameUI">
            <span id="uiPlayerName">Joueur</span>
            <span id="uiScore">Score : 0</span>
        </div>

        <canvas id="gameCanvas"></canvas> 
        
    </div>
    
    <script src="script.js"></script>
</body>
</html>
